name: Golden Path CI

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version for lint and test jobs
        required: false
        type: string
        default: "20"
      terraform_version:
        description: Terraform version for IaC validation
        required: false
        type: string
        default: "1.7.0"
      run_terraform_plan:
        description: Run security scan and Terraform plan jobs
        required: false
        type: boolean
        default: false
      run_terraform_apply:
        description: Apply Terraform in the dev stack
        required: false
        type: boolean
        default: false
      build_and_push:
        description: Build and push Docker images to ECR
        required: false
        type: boolean
        default: false
    secrets:
      aws_role_arn:
        description: AWS IAM role ARN for OIDC federation
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: npm run lint --workspace=packages/backend

      - name: Lint frontend
        run: npm run lint --workspace=packages/frontend

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        run: npm install

      - name: Run backend tests with coverage
        run: npm run test --workspace=packages/backend -- --coverage --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Append coverage summary
        run: |
          node -e 'const fs=require("fs");const p="packages/backend/coverage/coverage-summary.json";const c=JSON.parse(fs.readFileSync(p,"utf8")).total;const msg=`## Test Coverage\n- Lines: ${c.lines.pct}%\n- Branches: ${c.branches.pct}%\n- Functions: ${c.functions.pct}%\n- Statements: ${c.statements.pct}%`;fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,msg+"\n");'

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    if: ${{ inputs.run_terraform_plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Checkov
        run: python -m pip install --upgrade checkov

      - name: Run Checkov on infra
        run: checkov -d infra --hard-fail-on HIGH

  terraform-plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    if: ${{ inputs.run_terraform_plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform init and validate
        working-directory: infra/stacks/dev
        run: |
          set -euo pipefail
          terraform init -backend=false
          terraform validate

      - name: Run TFLint
        run: |
          tflint --chdir=infra/stacks/dev --init
          tflint --chdir=infra/stacks/dev

      - name: Terraform plan
        working-directory: infra/stacks/dev
        run: terraform plan -out=tfplan

      - name: Terraform plan summary
        working-directory: infra/stacks/dev
        run: |
          {
            echo "## Terraform Plan"
            echo
            terraform show -no-color tfplan | sed -n '1,120p'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f packages/backend/Dockerfile packages/backend/

      - name: Build frontend Docker image
        run: docker build --build-arg REACT_APP_USERNAME=${{ github.actor }} -f packages/frontend/Dockerfile packages/frontend/

  terraform-apply:
    name: terraform-apply
    runs-on: ubuntu-latest
    if: ${{ inputs.run_terraform_apply && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [terraform-plan]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Update provider for OIDC
        working-directory: infra/stacks/dev
        run: |
          sed -i -E '/^  # backend "s3" \{/,/^  # \}/s/^  # ?//' main.tf
          sed -i -E '/^[[:space:]]*(access_key|secret_key|skip_credentials_validation|skip_metadata_api_check|skip_region_validation|skip_requesting_account_id)[[:space:]]*=/d' main.tf

      - name: Terraform init
        working-directory: infra/stacks/dev
        run: terraform init -backend-config="key=todo-service/${{ github.repository }}/dev/terraform.tfstate"

      - name: Terraform plan and apply
        working-directory: infra/stacks/dev
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Show deployment URL
        working-directory: infra/stacks/dev
        run: |
          SERVICE_URL=$(terraform output -raw service_url)
          {
            echo "## Deployment complete"
            echo
            echo "| Output | Value |"
            echo "|--------|-------|"
            echo "| Load Balancer URL | $SERVICE_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    if: ${{ inputs.build_and_push && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [terraform-apply]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Resolve ECR repository URLs
        id: ecr-repos
        working-directory: infra/stacks/dev
        run: |
          set -euo pipefail
          sed -i -E '/^  # backend "s3" \{/,/^  # \}/s/^  # ?//' main.tf
          terraform init -reconfigure -backend-config="key=todo-service/${{ github.repository }}/dev/terraform.tfstate"
          echo "backend_repo=$(terraform output -raw backend_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=$(terraform output -raw frontend_ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          BACKEND_REPO: ${{ steps.ecr-repos.outputs.backend_repo }}
        run: |
          docker build -t "$BACKEND_REPO:${{ github.sha }}" -t "$BACKEND_REPO:latest" -f packages/backend/Dockerfile packages/backend/
          docker push "$BACKEND_REPO:${{ github.sha }}"
          docker push "$BACKEND_REPO:latest"

      - name: Build and push frontend image
        env:
          FRONTEND_REPO: ${{ steps.ecr-repos.outputs.frontend_repo }}
        run: |
          docker build --build-arg REACT_APP_USERNAME=${{ github.actor }} -t "$FRONTEND_REPO:${{ github.sha }}" -t "$FRONTEND_REPO:latest" -f packages/frontend/Dockerfile packages/frontend/
          docker push "$FRONTEND_REPO:${{ github.sha }}"
          docker push "$FRONTEND_REPO:latest"

      - name: Deploy images to ECS
        run: |
          CLUSTER=$(aws ecs list-clusters --query 'clusterArns[0]' --output text | xargs -I{} aws ecs describe-clusters --clusters {} --query 'clusters[0].clusterName' --output text)
          SERVICE=$(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns[0]' --output text | xargs -I{} aws ecs describe-services --cluster "$CLUSTER" --services {} --query 'services[0].serviceName' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
          {
            echo "## ECS deployment triggered"
            echo "Cluster: \`$CLUSTER\`  Service: \`$SERVICE\`"
            echo "Backend image: \`${{ steps.ecr-repos.outputs.backend_repo }}:latest\`"
            echo "Frontend image: \`${{ steps.ecr-repos.outputs.frontend_repo }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
